[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:cron]
command=/usr/sbin/cron -f
autorestart=true
priority=10
user=root
stdout_logfile=/var/log/cron.log
stderr_logfile=/var/log/cron.err.log

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autorestart=true
priority=20
user=root
stdout_logfile=/var/log/php-fpm.log
stderr_logfile=/var/log/php-fpm.err.log

; Fast & light queues — single worker, highest priority
[program:queue_worker_fast]
command=php /var/www/html/artisan queue:work --queue=fastJob --sleep=3 --tries=3 --timeout=300 --max-jobs=1000 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=1
autorestart=true
startretries=3
priority=30
user=www-data
stdout_logfile=/var/log/queue-worker-fast.log
stderr_logfile=/var/log/queue-worker-fast.err.log

; Heavy queue — multiple concurrent workers to drain the backlog
; Increase numprocs based on available CPU cores (e.g. numprocs = CPU cores - 1)
[program:queue_worker_heavy]
command=php /var/www/html/artisan queue:work --queue=queueJob --sleep=5 --tries=3 --timeout=600 --max-jobs=200 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=3
autorestart=true
startretries=3
priority=40
user=www-data
stdout_logfile=/var/log/queue-worker-heavy-%(process_num)02d.log
stderr_logfile=/var/log/queue-worker-heavy-%(process_num)02d.err.log